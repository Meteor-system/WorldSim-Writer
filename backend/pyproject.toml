[project]
name = "worldsim-writer-backend"
version = "0.1.0"
description = "FastAPI backend for the WorldSim-Writer MVP loop"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "email-validator>=2.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "passlib>=1.7.4",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/import_node/router.py" = ["I001"]
"app/llm/client.py" = ["I001"]
"app/narrative/router.py" = ["I001"]
"app/narrative_control_center/service.py" = ["I001"]
"app/snapshot_export/router.py" = ["I001"]
"app/snapshot_export/service.py" = ["I001"]
"app/tags/router.py" = ["I001"]
"app/tags/service.py" = ["I001"]
"app/world/service.py" = ["I001"]
"tests/conftest.py" = ["I001"]
"tests/test_e2e_scripts.py" = ["I001"]
"tests/test_migrations.py" = ["I001"]
"tests/test_snapshot_export.py" = ["I001"]
"tests/test_timeline_diff.py" = ["I001"]
"tests/test_world_brief_expand.py" = ["I001"]
